[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ahoy-streamer-terminal"
version = "0.1.0"
description = "A keyboard-first terminal for AHOY Streamer"
requires-python = ">=3.11"

[project.scripts]
ahoy-streamer = "ahoy_streamer_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
